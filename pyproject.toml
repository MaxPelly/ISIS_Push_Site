[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isis-push-site"
version = "0.1.0"
description = "Mobile push notifications (PWA) for the ISIS Beam Monitor"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12.14,<4",
    "pywebpush>=2.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-aiohttp",
]

[tool.setuptools]
packages = ["push_site"]

[tool.setuptools.package-data]
push_site = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
