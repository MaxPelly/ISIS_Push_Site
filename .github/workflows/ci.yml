name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements*.txt
    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Lint
      run: ruff check .
    - name: Test
      # The gate sits a little under the measured coverage (99%), so it catches
      # a real drop without failing on a small one.
      run: pytest --cov=push_site --cov-branch --cov-report=term-missing --cov-fail-under=97

  deploy-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        persist-credentials: false
    - name: Check the admin wrapper and sudoers file
      run: |
        sh -n deploy/isis-push
        sudo visudo -cf deploy/isis-push.sudoers
    - name: Check the systemd unit (best effort; its paths don't exist here)
      continue-on-error: true
      run: |
        sed -e "/^#/!s|/path/to/ISIS_Beam_Monitor|$PWD|g" deploy/isis-push-site.service > "$RUNNER_TEMP/isis-push-site.service"
        systemd-analyze verify "$RUNNER_TEMP/isis-push-site.service"
