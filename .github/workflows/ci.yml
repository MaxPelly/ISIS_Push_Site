name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev]'
    - name: Lint
      run: ruff check .
    - name: Test
      # The gate sits a little under the measured coverage (98%), so it catches
      # a real drop without failing on a small one.
      run: pytest --cov=push_site --cov-branch --cov-report=term-missing --cov-fail-under=97

  deploy-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        persist-credentials: false
    - name: Check the admin wrapper and sudoers file
      run: |
        sh -n deploy/isis-push
        visudo -cf deploy/isis-push.sudoers
    - name: Check the systemd unit
      run: |
        # The interpreter where the unit expects it
        sudo mkdir -p /opt/isis-push-site/.venv/bin
        sudo ln -s "$(command -v python3)" /opt/isis-push-site/.venv/bin/python
        systemd-analyze verify deploy/isis-push-site.service
